security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            custom_authenticators:
                - App\Security\FormAuthenticator
            logout:
                path: app_logout
                target: app_login

    access_control:
        # Allow public access to authentication routes
        - { path: ^/auth/google, roles: PUBLIC_ACCESS }
        - { path: ^/auth/(login|register), roles: PUBLIC_ACCESS }
        - { path: ^/$, roles: PUBLIC_ACCESS }
        # Accès restreints selon le rôle
        - { path: ^/admin, roles: [ROLE_PROFESSEUR, ROLE_ADMIN] }
        - { path: ^/student, roles: ROLE_ETUDIANT }