security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            custom_authenticators:
                - App\Security\FormAuthenticator
            logout:
                path: app_logout
                target: app_login

    access_control:
        # Forum : professeurs et étudiants (connectés)
        - { path: ^/forum, roles: ROLE_USER }
        # Public: login, register, Google OAuth (start + callback), forgot/reset password
        - { path: ^/auth/, roles: PUBLIC_ACCESS }
        - { path: ^/$, roles: PUBLIC_ACCESS }
        - { path: ^/forgot-password, roles: PUBLIC_ACCESS }
        - { path: ^/reset-password, roles: PUBLIC_ACCESS }
        # Accès restreints selon le rôle (main + fedi-work)
        - { path: ^/admin, roles: [ROLE_PROFESSEUR, ROLE_ADMIN, ROLE_CHEF_DEPT] }
        - { path: ^/student, roles: ROLE_ETUDIANT }