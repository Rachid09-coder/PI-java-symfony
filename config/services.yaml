# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    uploads_directory: '%kernel.project_dir%/public/uploads'
    app.hmac_secret: '%env(default:app_hmac_default:HMAC_SECRET)%'
    app_hmac_default: 'edusmart-secret-change-me-in-production'
    app.base_url: '%env(default:app_base_url_default:APP_BASE_URL)%'
    app_base_url_default: 'http://127.0.0.1:8000'
    app.gemini_api_key: '%env(default:gemini_default:GEMINI_API_KEY)%'
    gemini_default: ''
    # OpenAI
    app.openai_api_key: '%env(default:openai_default:OPENAI_API_KEY)%'
    openai_default: ''
    # Groq (gratuit)
    app.groq_api_key: '%env(default:groq_default:GROQ_API_KEY)%'
    groq_default: ''
    # Twilio SMS
    app.twilio_account_sid: '%env(default:twilio_default:TWILIO_ACCOUNT_SID)%'
    app.twilio_auth_token: '%env(default:twilio_default:TWILIO_AUTH_TOKEN)%'
    app.twilio_from_number: '%env(default:twilio_default:TWILIO_FROM_NUMBER)%'
    twilio_default: ''
    # OAuth Google & reCAPTCHA (yassine-user)
    oauth_google_client_id: '%env(OAUTH_GOOGLE_CLIENT_ID)%'
    oauth_google_client_secret: '%env(OAUTH_GOOGLE_CLIENT_SECRET)%'
    oauth_google_callback_url: '%env(OAUTH_GOOGLE_CALLBACK_URL)%'
    recaptcha_site_key: '%env(RECAPTCHA_SITE_KEY)%'
    recaptcha_secret: '%env(RECAPTCHA_SECRET)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
    App\Service\FileUploader:
        arguments:
            $targetDirectory: '%uploads_directory%'
    App\Service\AiCourseGeneratorService:
        arguments:
            $openaiApiKey: '%env(default::OPENAI_API_KEY)%'

    App\Service\ExamSimilarityService:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Service\HmacService:
        arguments:
            $hmacSecret: '%app.hmac_secret%'

    App\Service\PdfGeneratorService:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Service\EmailService:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Service\GeminiAiService:
        arguments:
            $geminiApiKey: '%app.gemini_api_key%'

    App\Service\AiService:
        arguments:
            $groqApiKey: '%app.groq_api_key%'

    App\Service\SmsService:
        arguments:
            $twilioAccountSid: '%app.twilio_account_sid%'
            $twilioAuthToken: '%app.twilio_auth_token%'
            $twilioFromNumber: '%app.twilio_from_number%'

    App\Security\FormAuthenticator:
        arguments:
            $recaptchaSecret: '%recaptcha_secret%'
